version: '3.8'

services:
  panwatch:
    # 从本地代码构建镜像（替换从 Docker Hub 拉取）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: panwatch:local
    container_name: panwatch
    ports:
      - "0.0.0.0:8001:8000"
    volumes:
      - panwatch_data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - DOCKER=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  panwatch_data:
    driver: local
